name: CI and Validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src tests
      - name: Unit tests
        env: {PYTHONPATH: .}
        run: pytest -q
      - name: Site build
        env: {PYTHONPATH: .}
        run: python -m src.papertrade.site
