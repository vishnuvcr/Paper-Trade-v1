name: NoDip Paper Trade

on:
  workflow_dispatch:
    inputs:
      variant:
        description: NoDip expiry variant
        type: choice
        options:
          - ALL
          - NODIP_3W
          - NODIP_1W
        default: ALL
      diagnostic:
        description: Run as diagnostic only
        type: boolean
        default: true
  schedule:
    - cron: '35 9 * * 1-5'
      timezone: Asia/Kolkata

permissions:
  contents: write

concurrency:
  group: nodip-paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run NoDip
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.diagnostic }}" = "true" ]; then
            if [ "${{ inputs.variant }}" = "NODIP_3W" ]; then
              python -m src.papertrade.cli scan --strategy NODIP_3W --manual
            elif [ "${{ inputs.variant }}" = "NODIP_1W" ]; then
              python -m src.papertrade.cli scan --strategy NODIP_1W --manual
            else
              python -m src.papertrade.cli scan --strategy NODIP --manual
            fi
          else
            python -m src.papertrade.cli scan --strategy NODIP
          fi
      - name: Persist records
        uses: EndBug/add-and-commit@v9
        with:
          add: data
          message: 'ops: NoDip update'
