name: MC-RQ6 Paper Trade

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        type: boolean
        default: true
  schedule:
    - cron: '30 9 * * 1-5'
      timezone: Asia/Kolkata
    - cron: '35 9 * * 1-5'
      timezone: Asia/Kolkata
    - cron: '40 9 * * 1-5'
      timezone: Asia/Kolkata

permissions:
  contents: write

concurrency:
  group: mc-rq6-paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run MC-RQ6
        env:
          PYTHONPATH: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.diagnostic }}" = "true" ]; then
            python -m src.papertrade.cli scan --strategy MC --manual
          else
            python -m src.papertrade.cli scan --strategy MC
          fi
      - name: Persist records
        uses: EndBug/add-and-commit@v9
        with:
          add: data
          message: 'ops: MC-RQ6 update'
